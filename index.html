<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Arcade</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b18;
      color: white;
      text-align: center;
    }

    header {
      padding: 50px 20px;
      background: linear-gradient(135deg, #661cff, #00c8ff);
    }

    h1 {
      margin: 0;
      font-size: 48px;
    }

    header p {
      font-size: 19px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      margin: 6px;
      color: white;
      background: #733cff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #00a9e8;
    }

    .play-button {
      margin-top: 15px;
      background: #ff287d;
      font-size: 22px;
      padding: 16px 35px;
    }

    nav {
      padding: 15px;
      background: #121a31;
    }

    main {
      max-width: 850px;
      margin: 25px auto;
      padding: 15px;
    }

    .game {
      display: none;
      padding: 25px;
      min-height: 350px;
      border-radius: 15px;
      background: #151e39;
    }

    .game.active {
      display: block;
    }

    .score {
      color: #00eaff;
      font-size: 24px;
      font-weight: bold;
    }

    #clickButton {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #ff287d;
      font-size: 24px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      justify-content: center;
      gap: 8px;
      margin: 20px auto;
    }

    .cell {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #293762;
      font-size: 44px;
      cursor: pointer;
    }

    canvas {
      max-width: 100%;
      border: 3px solid #00eaff;
      background: #03050a;
    }

    footer {
      padding: 25px;
      color: #aab4d1;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 Pixel Arcade</h1>
    <p>Play fun browser games for free!</p>

    <!-- This is a button, not a broken page link -->
    <button class="play-button" onclick="showGame('clicker')">
      ▶ Play Now
    </button>
  </header>

  <nav>
    <button onclick="showGame('clicker')">⚡ Clicker</button>
    <button onclick="showGame('tictactoe')">⭕ Tic-Tac-Toe</button>
    <button onclick="showGame('snake')">🐍 Snake</button>
  </nav>

  <main>

    <section id="clicker" class="game active">
      <h2>⚡ Super Clicker</h2>
      <p>Click the button as many times as possible.</p>

      <p class="score">
        Score: <span id="clickScore">0</span>
      </p>

      <button id="clickButton" onclick="addClick()">CLICK!</button>
      <br>
      <button onclick="resetClicker()">Reset</button>
    </section>

    <section id="tictactoe" class="game">
      <h2>⭕ Tic-Tac-Toe</h2>
      <p id="turnText">Player X's turn</p>

      <div id="board">
        <div class="cell" onclick="playCell(0)"></div>
        <div class="cell" onclick="playCell(1)"></div>
        <div class="cell" onclick="playCell(2)"></div>
        <div class="cell" onclick="playCell(3)"></div>
        <div class="cell" onclick="playCell(4)"></div>
        <div class="cell" onclick="playCell(5)"></div>
        <div class="cell" onclick="playCell(6)"></div>
        <div class="cell" onclick="playCell(7)"></div>
        <div class="cell" onclick="playCell(8)"></div>
      </div>

      <button onclick="resetTicTacToe()">New Game</button>
    </section>

    <section id="snake" class="game">
      <h2>🐍 Snake</h2>
      <p>Use your keyboard arrow keys to move.</p>

      <p class="score">
        Score: <span id="snakeScore">0</span>
      </p>

      <canvas id="snakeCanvas" width="400" height="400"></canvas>
      <br>
      <button onclick="startSnake()">Start Snake</button>
    </section>

  </main>

  <footer>
    Pixel Arcade © 2026
  </footer>

  <script>
    function showGame(gameName) {
      document.querySelectorAll(".game").forEach(function(game) {
        game.classList.remove("active");
      });

      document.getElementById(gameName).classList.add("active");

      window.scrollTo({
        top: document.querySelector("main").offsetTop,
        behavior: "smooth"
      });
    }

    // Clicker game
    let clickScore = 0;

    function addClick() {
      clickScore++;
      document.getElementById("clickScore").textContent = clickScore;
    }

    function resetClicker() {
      clickScore = 0;
      document.getElementById("clickScore").textContent = 0;
    }

    // Tic-Tac-Toe game
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let gameOver = false;

    function playCell(index) {
      if (board[index] !== "" || gameOver) {
        return;
      }

      board[index] = currentPlayer;
      document.querySelectorAll(".cell")[index].textContent = currentPlayer;

      if (checkWinner()) {
        document.getElementById("turnText").textContent =
          "Player " + currentPlayer + " wins!";
        gameOver = true;
        return;
      }

      if (!board.includes("")) {
        document.getElementById("turnText").textContent = "It's a draw!";
        gameOver = true;
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";

      document.getElementById("turnText").textContent =
        "Player " + currentPlayer + "'s turn";
    }

    function checkWinner() {
      const winningLines = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
      ];

      return winningLines.some(function(line) {
        return board[line[0]] &&
          board[line[0]] === board[line[1]] &&
          board[line[1]] === board[line[2]];
      });
    }

    function resetTicTacToe() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      gameOver = false;

      document.querySelectorAll(".cell").forEach(function(cell) {
        cell.textContent = "";
      });

      document.getElementById("turnText").textContent =
        "Player X's turn";
    }

    // Snake game
    const canvas = document.getElementById("snakeCanvas");
    const context = canvas.getContext("2d");

    let snake = [];
    let food = {};
    let direction = "RIGHT";
    let snakeScore = 0;
    let snakeTimer;

    function startSnake() {
      clearInterval(snakeTimer);

      snake = [
        { x: 200, y: 200 },
        { x: 180, y: 200 },
        { x: 160, y: 200 }
      ];

      direction = "RIGHT";
      snakeScore = 0;

      document.getElementById("snakeScore").textContent = 0;
      createFood();
      drawSnake();

      snakeTimer = setInterval(updateSnake, 120);
    }

    function createFood() {
      food = {
        x: Math.floor(Math.random() * 20) * 20,
        y: Math.floor(Math.random() * 20) * 20
      };
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowUp" && direction !== "DOWN") {
        direction = "UP";
      }

      if (event.key === "ArrowDown" && direction !== "UP") {
        direction = "DOWN";
      }

      if (event.key === "ArrowLeft" && direction !== "RIGHT") {
        direction = "LEFT";
      }

      if (event.key === "ArrowRight" && direction !== "LEFT") {
        direction = "RIGHT";
      }
    });

    function updateSnake() {
      const head = {
        x: snake[0].x,
        y: snake[0].y
      };

      if (direction === "UP") head.y -= 20;
      if (direction === "DOWN") head.y += 20;
      if (direction === "LEFT") head.x -= 20;
      if (direction === "RIGHT") head.x += 20;

      const hitWall =
        head.x < 0 ||
        head.x >= canvas.width ||
        head.y < 0 ||
        head.y >= canvas.height;

      const hitBody = snake.some(function(part) {
        return part.x === head.x && part.y === head.y;
      });

      if (hitWall || hitBody) {
        clearInterval(snakeTimer);
        alert("Game over! Score: " + snakeScore);
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        snakeScore++;
        document.getElementById("snakeScore").textContent = snakeScore;
        createFood();
      } else {
        snake.pop();
      }

      drawSnake();
    }

    function drawSnake() {
      context.fillStyle = "#03050a";
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = "#00eaff";

      snake.forEach(function(part) {
        context.fillRect(part.x, part.y, 18, 18);
      });

      context.fillStyle = "#ff287d";
      context.fillRect(food.x, food.y, 18, 18);
    }
  </script>

</body>
</html>111111111111111111
